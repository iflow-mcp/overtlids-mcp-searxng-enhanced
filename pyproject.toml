[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iflow-mcp_overtlids_mcp-searxng-enhanced"
version = "1.1.1"
description = "A Model Context Protocol (MCP) server for category-aware web search, website scraping, and date/time tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "OvertliDS", email = "noreply@github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.20.0,<1.0.0",
    "beautifulsoup4>=4.9.0,<5.0.0",
    "pydantic>=1.8.0,<3.0.0",
    "tzdata>=2022.1",
    "trafilatura>=1.8.0,<2.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
    "cachetools>=5.0.0,<6.0.0",
    "filetype>=1.1.0,<2.0.0",
    "pymupdf>=1.20.0,<2.0.0",
    "pymupdf4llm>=0.0.20,<0.1",
]

[project.scripts]
iflow-mcp-overtlids-mcp-searxng-enhanced = "mcp_server:run_sync"

[project.urls]
Homepage = "https://github.com/OvertliDS/mcp-searxng-enhanced"
Repository = "https://github.com/OvertliDS/mcp-searxng-enhanced"
Issues = "https://github.com/OvertliDS/mcp-searxng-enhanced/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "/mcp_server.py",
    "/README.md",
    "/LICENSE",
    "/requirements.txt",
]